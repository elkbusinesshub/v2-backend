# nginx site for the ELK API. Install as its own file so the existing app on
# :8000 keeps its own server block untouched:
#
#   sudo cp deploy/nginx/elk-api.conf /etc/nginx/sites-available/elk-api
#   sudo ln -s /etc/nginx/sites-available/elk-api /etc/nginx/sites-enabled/elk-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the plain-HTTP version. Run certbot afterwards and it rewrites this
# file in place, adding the :443 server, the certificate lines, and an HTTP→
# HTTPS redirect:
#
#   sudo certbot --nginx -d api.example.com
#
# Replace api.example.com with your real domain before installing.

upstream elk_api {
    # Matches API_HOST_PORT in deploy/.env — the API is bound to loopback only.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Image uploads go through the API and are resized with sharp. The JSON
    # body parser is capped at 1mb in the app; this only needs to admit
    # multipart uploads.
    client_max_body_size 25m;

    # Let the app (which trusts exactly one proxy hop) see the real client.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Socket.IO: needs the upgrade headers and a timeout longer than the
    # client's ping interval, or idle websockets get cut.
    location /socket.io/ {
        proxy_pass http://elk_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    location / {
        proxy_pass http://elk_api;
        # Empty Connection header lets keepalive to the upstream work.
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Probes are unauthenticated and outside the /api prefix. Keep them off the
    # public internet; uncomment to restrict to the instance itself.
    # location ~ ^/health/(live|ready)$ {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://elk_api;
    # }
}
